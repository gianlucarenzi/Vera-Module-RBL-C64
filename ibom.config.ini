; InteractiveHtmlBom: local settings for this board (read by the plugin
; started from pcbnew and by tools/generate_ibom.py, run by output_job.sh).
; The interactive BOM goes to ibom/ibom.html,
; the one linked from README.md.
[general]
bom_dest_dir=ibom/
bom_name_format=ibom
include_tracks=1
include_nets=1
