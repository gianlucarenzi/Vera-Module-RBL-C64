# Photorealistic assembly video of the enclosure: the frames of
# tools/render_enclosure.py (RENDER_MODE=anim, Blender and Cycles) split over
# many parallel jobs, then tools/make_video.sh: GIF, MP4 and a silent teaser
# (credits and end card). The teaser with music: the Teaser workflow on the
# frames of this run. By hand only: Actions > Video > Run workflow. Results
# in the "video" artifact.
# The desk (RENDER_MODE=desk, tools/desk_scene.py) follows the assembly in
# the teaser: the computer plugs in, the monitors switch on. For the Atari
# 130XE it needs the 3D models of the private repository 3DRepo: the
# private half of a read-only deploy key of 3DRepo in the secret
# THREEDREPO_KEY. desk_seconds 0: no desk.
name: Video

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "animation length (s)"
        default: "12"
      desk_seconds:
        description: "length of the desk part (s), 0: none"
        default: "10.5"
      fps:
        description: "frames per second"
        default: "24"
      samples:
        description: "Cycles samples (with the denoiser)"
        default: "64"
      resolution:
        description: "WxH"
        default: 1920x1080
      jobs:
        description: "parallel render jobs (at most 20 on a free account)"
        default: "20"
      variant:
        description: "backpanel or open (port window)"
        type: choice
        options: [backpanel, open]
        default: backpanel
      color:
        description: "case colour, sRGB hex (E3D9C6 = RAL 1013 Oyster white)"
        default: E3D9C6
      floor:
        description: "table under the enclosure"
        type: choice
        options: [oak, pine, grey]
        default: oak

permissions:
  contents: read

env:
  HDMI_REPO: gianlucarenzi/Vera-HDMI-Expansion
  ASSETS_REPO: gianlucarenzi/3DRepo
  LIB_REPO: gianlucarenzi/RetroBitLab-Library
  KICAD5_APPIMAGE: KiCad-5.1.12-2.2.0-x86_64.AppImage
  KICAD5_URL: https://github.com/gianlucarenzi/kicad_appimage_builder/releases/download/v2.2.0/KiCad-5.1.12-2.2.0-x86_64.AppImage
  # the official build: the Debian one has no OpenImageDenoise (denoiser)
  BLENDER: blender-4.2.23-linux-x64
  BLENDER_URL: https://download.blender.org/release/Blender4.2/blender-4.2.23-linux-x64.tar.xz

defaults:
  run:
    shell: bash

jobs:
  vrml:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.6
      options: --user root
    timeout-minutes: 60
    steps:
      - name: Packages (curl for the AppImage)
        run: |
          command -v curl >/dev/null || { apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl ca-certificates; }
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.HDMI_REPO }}
          path: Vera-HDMI-Expansion
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.LIB_REPO }}
          path: RetroBitLab-Library
      - name: KiCad 5 AppImage (cached)
        id: kicad5
        uses: actions/cache@v4
        with:
          path: /opt/kicad5/${{ env.KICAD5_APPIMAGE }}
          key: ${{ env.KICAD5_APPIMAGE }}
      - name: Download KiCad 5 AppImage
        if: steps.kicad5.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/kicad5
          curl -fsSL -o "/opt/kicad5/$KICAD5_APPIMAGE" "$KICAD5_URL"
      - name: VRML of the module and of the HDMI board
        env:
          KILIBPATH: ${{ github.workspace }}/RetroBitLab-Library
        run: |
          chmod +x "/opt/kicad5/$KICAD5_APPIMAGE"
          export KICAD5_APPIMAGE="/opt/kicad5/$KICAD5_APPIMAGE"
          tools/make_vrml.sh VERA-MODULE-RBL.kicad_pcb vrml/VERA-MODULE-RBL.wrl
          tools/make_vrml.sh Vera-HDMI-Expansion/VERA-HDMI-Expansion.kicad_pcb vrml/VERA-HDMI-Expansion.wrl
      - uses: actions/upload-artifact@v4
        with:
          name: vrml
          path: vrml/*.wrl
          retention-days: 3

  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      total: ${{ steps.plan.outputs.total }}
      desk: ${{ steps.plan.outputs.desk }}
    steps:
      - id: plan
        env:
          SECONDS_: ${{ inputs.seconds }}
          DESK_SECONDS: ${{ inputs.desk_seconds }}
          FPS: ${{ inputs.fps }}
          JOBS: ${{ inputs.jobs }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          # chunks "f1-15" (assembly) and "d1-12" (desk); a desk frame costs
          # about 1.5 assembly frames
          import json, os
          fps = int(os.environ["FPS"])
          total = round(float(os.environ["SECONDS_"]) * fps)
          desk = round(float(os.environ["DESK_SECONDS"]) * fps)
          jobs = max(2, int(os.environ["JOBS"]))
          jd = round(jobs * 1.5 * desk / (total + 1.5 * desk)) if desk else 0
          jd = min(max(jd, 1 if desk else 0), jobs - 1)
          chunks = []
          for kind, n, j in (("f", total, jobs - jd), ("d", desk, jd)):
              if n:
                  step = -(-n // max(1, min(j, n)))
                  chunks += ["%s%d-%d" % (kind, a, min(a + step - 1, n)) for a in range(1, n + 1, step)]
          print("chunks=" + json.dumps(chunks))
          print("total=%d" % total)
          print("desk=%d" % desk)
          EOF
          cat "$GITHUB_OUTPUT"

  screens:
    # the screen images and the key legends (tools/make_screens.py)
    runs-on: ubuntu-latest
    container: debian:latest
    timeout-minutes: 20
    steps:
      - name: Packages (Pillow, fonts)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates python3 python3-pil fonts-dejavu-core
      - uses: actions/checkout@v4
      - name: Key for 3DRepo (the 130XE desk)
        env:
          TOKEN: ${{ secrets.THREEDREPO_KEY }}
          NAME: ${{ github.event.repository.name }}
          DESK_SECONDS: ${{ inputs.desk_seconds }}
        run: |
          if [ -z "$TOKEN" ] && [ "$DESK_SECONDS" != "0" ] && echo "$NAME" | grep -q XE; then
            echo "::error::the 130XE desk needs the secret THREEDREPO_KEY (a read-only deploy key of 3DRepo)"
            exit 1
          fi
      - name: Screens and legends
        run: python3 tools/make_screens.py screens
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens/*
          retention-days: 3

  frames:
    needs: [vrml, plan, screens]
    runs-on: ubuntu-latest
    container: debian:latest
    timeout-minutes: 300
    strategy:
      fail-fast: true
      matrix:
        range: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - name: Packages (libraries of the official Blender)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl xz-utils zstd openssh-client \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 \
            libgl1 libegl1 libglu1-mesa libwayland-client0 libwayland-cursor0 libwayland-egl1 libdecor-0-0
      - name: Blender (cached)
        id: blender
        uses: actions/cache@v4
        with:
          path: /opt/${{ env.BLENDER }}
          key: ${{ env.BLENDER }}
      - name: Download Blender
        if: steps.blender.outputs.cache-hit != 'true'
        run: curl -fsSL "$BLENDER_URL" | tar -xJ -C /opt
      - uses: actions/checkout@v4
      - name: Key for 3DRepo
        id: token
        env:
          TOKEN: ${{ secrets.THREEDREPO_KEY }}
        run: if [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: startsWith(matrix.range, 'd') && steps.token.outputs.ok == 'true'
        with:
          repository: ${{ env.ASSETS_REPO }}
          ssh-key: ${{ secrets.THREEDREPO_KEY }}
          path: 3DRepo
          sparse-checkout: Atari/XE
      - uses: actions/download-artifact@v4
        with:
          name: vrml
          path: vrml
      - uses: actions/download-artifact@v4
        if: startsWith(matrix.range, 'd')
        with:
          name: screens
          path: screens
      - name: Frames ${{ matrix.range }}
        env:
          CHUNK: ${{ matrix.range }}
          DESK_SECONDS: ${{ inputs.desk_seconds }}
          DESK_ASSETS: ${{ github.workspace }}/3DRepo/Atari/XE
          DESK_SCREENS: ${{ github.workspace }}/screens
          RENDER_WRL: ${{ github.workspace }}/vrml/VERA-MODULE-RBL.wrl
          RENDER_HDMI_WRL: ${{ github.workspace }}/vrml/VERA-HDMI-Expansion.wrl
          RENDER_VARIANT: ${{ inputs.variant }}
          RENDER_COLOR: ${{ inputs.color }}
          RENDER_FLOOR: ${{ inputs.floor }}
          RENDER_SAMPLES: ${{ inputs.samples }}
          RENDER_RES: ${{ inputs.resolution }}
          RENDER_FPS: ${{ inputs.fps }}
          RENDER_SECONDS_ANIM: ${{ inputs.seconds }}
          RENDER_FRAMES_DIR: ${{ github.workspace }}/frames
        run: |
          export PATH="/opt/$BLENDER:$PATH"
          export RENDER_FRAMES="${CHUNK:1}"
          if [ "${CHUNK:0:1}" = d ]; then
            export RENDER_MODE=desk RENDER_SECONDS="$DESK_SECONDS"
          else
            export RENDER_MODE=anim RENDER_SECONDS="$RENDER_SECONDS_ANIM"
          fi
          blender -b --python-exit-code 1 -P tools/render_enclosure.py | grep -vE "^Fra:"
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.range }}
          path: frames/*.png
          retention-days: 3
          compression-level: 0

  video:
    needs: [plan, frames]
    runs-on: ubuntu-latest
    container: debian:latest
    timeout-minutes: 60
    steps:
      - name: Packages (ffmpeg, fonts)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl ffmpeg fonts-dejavu-core python3 python3-pil
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          path: frames
          merge-multiple: true
      - name: GIF, MP4 and teaser
        env:
          FPS: ${{ inputs.fps }}
          NAME: ${{ github.event.repository.name }}
        run: |
          test "$(ls frames/f*.png | wc -l)" -eq "${{ needs.plan.outputs.total }}"
          test "$(ls frames/d*.png 2>/dev/null | wc -l)" -eq "${{ needs.plan.outputs.desk }}"
          tools/make_video.sh frames "video/$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: video/*
          if-no-files-found: error
